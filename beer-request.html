
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ee">

  <title>Bellvale Beer Request</title>

  <link rel="icon" type="image/png"
        href="bellvle-beer-request-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f4ee;
      color: #161513;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(85%, 360px);
      padding: 28px;
    }

    img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    h1 {
      font-size: 25px;
    }

    p {
      line-height: 1.5;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      background: #4a6741;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <main>
    <img src="bellvle-beer-request-icon.png"
         alt="Bellvale Beer Request icon">

    <h1>Bellvale Beer Request</h1>

    <p>Open the form to submit a beer request.</p>

    <a href="https://script.google.com/macros/s/AKfycbynbTfz8GeMB_hi25nhXYGhyc84k8brhAfBdK16hOZ255seOSMItCjTxenxlFES6emrpQ/exec">
      Open Beer Request Form
    </a>
  </main>
  
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register(
        '/OldeCellarRequests/js/service-worker.js',
        { scope: '/OldeCellarRequests/' }
      );
    });
  }

</body>
</html>
